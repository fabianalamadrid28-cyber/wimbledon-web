# Configuración del Puerto del Servidor
server.port=8080

# Conexión Automática a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/wimbledon_db?createDatabaseIfNotExist=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=root

# Configuración de JPA / Hibernate para autoconstruir tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
