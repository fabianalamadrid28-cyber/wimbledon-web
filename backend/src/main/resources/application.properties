# Configuración del Puerto del Servidor
server.port=8080

# Conexión Automática a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/wimbledon_db?createDatabaseIfNotExist=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=123456

# Configuración de JPA / Hibernate para autoconstruir tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Sesión: cookie no accesible desde JS y no enviada en peticiones cross-site
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax